<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DV1 Order Planner</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <p class="eyebrow">Delineator · DV1</p>
        <h1>Plan an order before you work it in Eccang</h1>
        <p class="intro">Enter a Shopify order number to preview the recommended warehouse, split, carton, and solo-shipping plan.</p>
      </header>

      <form id="plan-form" class="search-card">
        <label for="order-number">Shopify order number</label>
        <div class="search-row">
          <input id="order-number" name="orderNumber" placeholder="WS-#10001" autocomplete="off" required />
          <button type="submit">Plan order</button>
        </div>
        <p class="hint">Fixture example: <button type="button" class="link-button" id="example-order">WS-#10001</button></p>
      </form>

      <section id="message" class="message" aria-live="polite"></section>
      <section id="result" class="result" hidden></section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
