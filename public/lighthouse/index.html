<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Review an order's latest fulfillment and tracking status." />
    <title>Lighthouse | Order tracking</title>
    <link rel="stylesheet" href="/lighthouse/styles.css" />
  </head>
  <body>
    <main>
      <section class="hero" aria-labelledby="page-title">
        <h1 id="page-title" class="brand">
          <img src="/lighthouse/logo.svg" alt="Velotric Order Tracker" width="235" height="140" />
        </h1>
        <p class="intro" id="instructions">Sign in to Lighthouse to track your orders.</p>
        <form id="setup-form" method="post" hidden>
          <div class="lookup-row">
            <div class="field">
              <label for="setup-password">New Lighthouse password</label>
              <input id="setup-password" name="password" type="password" minlength="15" maxlength="128" autocomplete="new-password" required />
            </div>
            <div class="field">
              <label for="confirm-password">Confirm password</label>
              <input id="confirm-password" name="confirmation" type="password" minlength="15" maxlength="128" autocomplete="new-password" required />
            </div>
            <button type="submit">Set password</button>
          </div>
        </form>
        <form id="login-form" method="post" hidden>
          <div class="lookup-row">
            <div class="field">
              <label for="login-email">Email used for your orders</label>
              <input id="login-email" name="email" type="email" maxlength="254" autocomplete="username" required />
            </div>
            <div class="field">
              <label for="login-password">Password</label>
              <input id="login-password" name="password" type="password" maxlength="128" autocomplete="current-password" required />
            </div>
            <button type="submit">Sign in</button>
          </div>
          <p>Need to set or reset your password? Ask your Velotric contact for a Lighthouse setup link.</p>
        </form>

        <form id="lookup-form" method="post" hidden>
          <div class="lookup-row">
            <div class="field">
              <label for="order-number">Order number</label>
              <input id="order-number" name="orderNumber" placeholder="WS-#12345" maxlength="64" autocomplete="off" required />
            </div>
            <div class="field">
              <label for="postal-code">Shipping postal code</label>
              <input id="postal-code" name="postalCode" placeholder="12345" maxlength="32" autocomplete="postal-code" required />
            </div>
            <button type="submit">Find order</button>
          </div>
        </form>
        <button id="sign-out" type="button" hidden>Sign out</button>
      </section>

      <section id="status" class="status-panel" aria-live="polite" hidden></section>
      <section id="result" class="result" aria-live="polite" hidden></section>
    </main>

    <footer>Current shipment information from Lighthouse.</footer>
    <script type="module" src="/lighthouse/app.js"></script>
  </body>
</html>
