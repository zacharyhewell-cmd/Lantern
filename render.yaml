services:
  - type: web
    name: lantern
    runtime: node
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: FEISHU_WEBHOOK_PATH
        value: /feishu/events
      - key: WATCHTOWER_RUN_PATH
        value: /watchtower/run
      - key: WATCHTOWER_CREATE_TIME_LOOKBACK_DAYS
        value: 30
      - key: WATCHTOWER_PRESHIP_THRESHOLD_HOURS
        value: 48
      - key: WATCHTOWER_IN_TRANSIT_THRESHOLD_HOURS
        value: 120
      - key: WATCHTOWER_SCHEDULE_ENABLED
        value: "false"
      - key: WATCHTOWER_SCHEDULE_TIME_ZONE
        value: America/Los_Angeles
      - key: WATCHTOWER_SCHEDULE_HOUR
        value: 22
      - key: WATCHTOWER_SCHEDULE_MINUTE
        value: 30
      - key: SHOPIFY_SHOP_DOMAIN
        value: velotric-dealers-shop.myshopify.com
      - key: SHOPIFY_API_VERSION
        value: 2026-01
      - key: FEISHU_LANTERN_CHAT_ID
        sync: false
      - key: FEISHU_APP_ID
        sync: false
      - key: FEISHU_APP_SECRET
        sync: false
      - key: FEISHU_VERIFICATION_TOKEN
        sync: false
      - key: WATCHTOWER_RUN_SECRET
        sync: false
      - key: WATCHTOWER_FEISHU_CHAT_ID
        sync: false
      - key: WATCHTOWER_SHEET_URL
        sync: false
      - key: WATCHTOWER_SHEET_TOKEN
        sync: false
      - key: WATCHTOWER_SHEET_TABS
        sync: false
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: SHOPIFY_ADMIN_ACCESS_TOKEN
        sync: false
      - key: FEDEX_CLIENT_ID
        sync: false
      - key: FEDEX_CLIENT_SECRET
        sync: false
      - key: SURPATH_MCP_URL
        sync: false
      - key: DV1_DATA_API_SECRET
        sync: false
      - key: DV1_UI_USERNAME
        sync: false
      - key: DV1_UI_PASSWORD
        sync: false
      - key: LIGHTHOUSE_UI_USERNAME
        sync: false
      - key: LIGHTHOUSE_UI_PASSWORD
        sync: false
      - key: LIGHTHOUSE_ACCOUNTS_DIRECTORY
        sync: false
      - key: LIGHTHOUSE_SETUP_SECRET
        sync: false
      - key: LIGHTHOUSE_PUBLIC_ENABLED
        value: "false"
      - key: LIGHTHOUSE_RATE_LIMIT_MAX
        value: "10"
      - key: LIGHTHOUSE_RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: DV1_DEFAULT_WAREHOUSE
        value: LA-SPI1
      - key: DV1_CARTON_SKUS
        value: ABOX0001,ABOX0002,ABOX0003,ABOX0004,ABOX0005,ABOX0006,ABOX0007
      - key: DV1_SOURCE_REFRESH_ENABLED
        value: "true"
      - key: DV1_SOURCE_REFRESH_INTERVAL_HOURS
        value: "168"
      - key: DV1_SOURCE_REFRESH_MAX_ROWS
        value: "250000"
      - key: DV1_SOURCE_REFRESH_MIN_COVERAGE
        value: "0.8"
      - key: DV1_SOURCE_REFRESH_ALERT_CHAT_ID
        sync: false
      - key: DV1_CATALOG_SPREADSHEET_TOKEN
        sync: false
      - key: DV1_CATALOG_SHEET_ID
        sync: false
      - key: DV1_FEDEX_SPREADSHEET_TOKEN
        sync: false
      - key: DV1_FEDEX_SHEET_ID
        sync: false
      - key: DV1_FEISHU_SPREADSHEET_TOKEN
        value: Rr4wsjvP3hgO5btcCHDcBHqGnRh
